name: e_tarabay
description: "Ang Kabataan ay Pagasa ng Bayan"
publish_to: 'none'
version: 1.0.5

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  

  # UI and Icons
  google_fonts: ^6.3.2
  animated_text_kit: ^4.3.0
  flutter_animate: ^4.5.2
  
  # State Management
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  
  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  audioplayers: ^6.1.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  confetti: ^0.8.0
  cached_network_image: ^3.4.1
  image: ^4.5.2
  share_plus: ^13.1.0
  gal: ^2.3.2
  flutter_lucide: ^1.11.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/bg_home.jpg
    - assets/images/bg_lesson.jpg
    - assets/images/bg_awards.jpg
    - assets/images/bg_settings.jpg
    - assets/images/E-TarabayCertificate.png
    - assets/images/male.png
    - assets/images/female.png
    - assets/images/card1.png
    - assets/images/card2.png
    - assets/images/card3.png
    - assets/images/card4.png
    - assets/images/card5.png
    - assets/images/paint1.png
    - assets/images/paint2.png
    - assets/images/paint3.png
    - assets/images/paint4.png
    - assets/images/paint5.png
    - assets/images/paint6.png
    - assets/images/paint7.png
    - assets/images/paint8.png
    - assets/images/paint9.png
    - assets/images/poem1.png
    - assets/images/poem2.png
    - assets/images/poem3.png
    - assets/images/poem4.png
    - assets/images/poem5.png
    - assets/images/kwento1.png
    - assets/images/kwento2.png
    - assets/images/kwento3.png
    - assets/images/kwento4.png
    - assets/images/kwento5.png
    - assets/images/song1.png
    - assets/images/song2.png
    - assets/images/song3.png
    - assets/images/song4.png
    - assets/images/song5.png
    - assets/images/song6.png
    - assets/images/song7.png
    - assets/images/song8.png
    - assets/images/app_logo.jpg
    - assets/images/app_logo-transparent.png
    - assets/audio/tunog.mp3
    - assets/audio/Ania ti Nagan Mo by Kurtjam Kyle Silva Nono.mp3
    - assets/audio/modules_bg/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo-transparent.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.jpg"
    background_color: "#5C52E5"
    theme_color: "#5C52E5"
